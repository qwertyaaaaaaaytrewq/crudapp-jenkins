version: '3.7'

services:
  web-server:
    image: qwertyaaaaaaaytrewq/front:latest
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
      - phpmyadmin
    deploy:
      replicas: 3
    networks:
      - appnet

  db:
    image: qwertyaaaaaaaytrewq/mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1'
      MYSQL_DATABASE: 'db'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.0.1
    restart: always
    environment:
      PMA_HOST: 'db'
      PMA_USER: 'root'
      PMA_PASSWORD: '1'
    ports:
      - "5000:80"
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql-data: