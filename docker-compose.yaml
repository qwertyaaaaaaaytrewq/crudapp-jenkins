version: '3.8'

services:

  web-server:
    image: ${DOCKER_HUB_USER}/front:${BUILD_NUMBER}
    environment:
      - DB_HOST=db
    ports:
      - "8080:80"
    deploy:
      replicas: 3
    networks:
      - appnet

  db:
    image: ${DOCKER_HUB_USER}/mysql:${BUILD_NUMBER}
    environment:
      MYSQL_ROOT_PASSWORD: '1'
      MYSQL_DATABASE: 'db'
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.0.1
    environment:
      PMA_HOST: 'db'
      PMA_USER: 'root'
      PMA_PASSWORD: '1'
    ports:
      - "5000:80"
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql-data: