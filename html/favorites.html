<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Избранное - Fitness App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <div class="sidebar">
        <h2>🏋 Fitness App</h2>
        <a href="profile.html" class="nav-btn">📋 Мой профиль</a>
        <a href="goals.html" class="nav-btn">🎯 Цели</a>
        <a href="calendar.html" class="nav-btn">📅 Календарь</a>
        <a href="health.html" class="nav-btn">❤️ Здоровье</a>
        <a href="workout.html" class="nav-btn">🏋️ Тренировки</a>
        <a href="meal.html" class="nav-btn">🍽️ Питание</a>
        <a href="favorites.html" class="nav-btn active">⭐ Избранное</a>
        <a href="#" onclick="logout()" class="nav-btn logout">🚪 Выйти</a>
    </div>
    <div class="content">
        <h1>⭐ Избранное</h1>
        
        <div class="favorites-tabs">
            <button class="tab-btn active" onclick="showTab('recipes')">🍽️ Любимые рецепты</button>
            <button class="tab-btn" onclick="showTab('exercises')">🏋️ Любимые упражнения</button>
        </div>
        
        <div id="recipesTab" class="tab-content active">
            <div class="section">
                <h2>🍽️ Любимые рецепты</h2>
                <div id="favoriteRecipesList" class="favorites-list">
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>
        
        <div id="exercisesTab" class="tab-content" style="display: none;">
            <div class="section">
                <h2>🏋️ Любимые упражнения</h2>
                <div id="favoriteExercisesList" class="favorites-list">
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="api.js"></script>
<script>
    if (!sessionStorage.getItem('token')) {
        window.location.href = 'index.html';
    }
    
    async function checkDbOnLoad() {
        const result = await checkDatabaseConnection();
        if (!result.connected) {
            showDatabaseErrorModal();
            startPeriodicDbCheck();
        }
    }
    
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        try {
            const response = await originalFetch.apply(this, args);
            if (response.status === 503) {
                showDatabaseErrorModal();
                startPeriodicDbCheck();
                throw new Error('База данных недоступна');
            }
            return response;
        } catch (error) {
            if (error.message === 'Failed to fetch' || error.message === 'NetworkError when attempting to fetch resource') {
                showDatabaseErrorModal();
                startPeriodicDbCheck();
            }
            throw error;
        }
    };
    
    checkDbOnLoad();
    
    setInterval(async () => {
        const result = await checkDatabaseConnection();
        if (!result.connected) {
            showDatabaseErrorModal();
            startPeriodicDbCheck();
        }
    }, 10000);
</script>
<script src="favorites.js"></script>
<script>
    if (!sessionStorage.getItem('token')) window.location.href = 'index.html';
    function logout() { sessionStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>
