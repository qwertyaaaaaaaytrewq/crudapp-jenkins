version: '3.8'

services:

  web-server:
    image: ${DOCKER_HUB_USER}/front:${BUILD_NUMBER}
    environment:
      - APP_ENV=canary
      - DB_HOST=db
    ports:
      - "8081:80"
    deploy:
      replicas: 1
    networks:
      - canarynet

  db:
    image: ${DOCKER_HUB_USER}/mysql:${BUILD_NUMBER}
    environment:
      MYSQL_ROOT_PASSWORD: '1'
      MYSQL_DATABASE: 'db'
    deploy:
      replicas: 1
    networks:
      - canarynet

networks:
  canarynet: